name: News Pulse Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements.txt

      - name: Run News Pulse pipeline
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          LOG_LEVEL:              INFO
          MAX_ARTICLES_PER_FEED:  50
          SIMILARITY_THRESHOLD:   0.25
          MAX_CLUSTERS:           20
          MIN_CLUSTER_SIZE:       2
          MIN_ARTICLE_LENGTH:     200
          REQUEST_TIMEOUT:        10
          NLTK_DATA:              /home/runner/nltk_data
        run: |
          cd scraper

          # Download NLTK data right before running
          # This ensures data is in the correct location
          python -c "
          import nltk
          import os
          nltk_dir = '/home/runner/nltk_data'
          os.makedirs(nltk_dir, exist_ok=True)
          nltk.data.path.insert(0, nltk_dir)
          packages = ['punkt', 'punkt_tab', 'stopwords', 'wordnet', 'omw-1.4']
          for pkg in packages:
              try:
                  nltk.download(pkg, download_dir=nltk_dir, quiet=False)
                  print(f'Downloaded: {pkg}')
              except Exception as e:
                  print(f'Warning: {pkg} failed: {e}')
          print('NLTK setup complete')
          "

          # Run the main pipeline
          python main.py

      - name: Done
        if: always()
        run: echo "Pipeline finished at $(date) — status ${{ job.status }}"