# =============================================================================
# GitHub Actions — Automated News Pulse Scraper
# Runs every 6 hours on GitHub's free cloud servers
# =============================================================================

name: News Pulse Scraper

on:
  # Automatic schedule — runs every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Manual trigger — run anytime from GitHub website
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # Step 1 — Download your code onto GitHub's server
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Install Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      # Step 3 — Install all Python packages
      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements.txt

      # Step 4 — Download NLTK language data
      - name: Download NLTK data
        run: |
          python -c "
          import nltk
          nltk.download('punkt', quiet=True)
          nltk.download('punkt_tab', quiet=True)
          nltk.download('stopwords', quiet=True)
          nltk.download('wordnet', quiet=True)
          nltk.download('omw-1.4', quiet=True)
          print('NLTK data ready')
          "

      # Step 5 — Run the actual scraper
      - name: Run News Pulse pipeline
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          LOG_LEVEL:              INFO
          MAX_ARTICLES_PER_FEED:  50
          SIMILARITY_THRESHOLD:   0.25
          MAX_CLUSTERS:           20
          MIN_CLUSTER_SIZE:       2
          MIN_ARTICLE_LENGTH:     200
          REQUEST_TIMEOUT:        10
        run: |
          cd scraper
          python main.py

      # Step 6 — Print summary
      - name: Done
        if: always()
        run: echo "Pipeline finished at $(date) with status ${{ job.status }}"